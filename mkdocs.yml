site_name: Loose Notes
site_description: Pull requests I've opened on open-source projects.
site_url: https://jatinarora30.github.io/blogs/
repo_url: https://github.com/jatinarora30/blogs
repo_name: blogs
edit_uri: ""
# caches-and-cpp.md is an old blog post, kept on disk but not published
exclude_docs: |
  *.drawio
  caches-and-cpp.md
  assets/caches-and-cpp/


theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.footer       # previous / next between posts
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - toc.follow
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

hooks:
  - hooks/release.py          # drafts hidden until `released: true`; flat nav, newest first
  - hooks/open_source.py      # homepage PR list, built from posts with `pr:`

plugins:
  - search
  - tags

extra:
  generator: false
  default_contributors: [jatinarora30]   # used when a post has no `contributors:`
  profile:                    # left-sidebar card
    name: Jatin Kumar Arora
    tagline: Robotics Engineer · Safe Autonomy
    url: https://jatinarora30.github.io/jatin-arora.github.io/
    initials: JA
    avatar: ""                # e.g. assets/images/me.jpg for a photo instead of initials
  social:
    - icon: material/account-circle
      link: https://jatinarora30.github.io/jatin-arora.github.io/
      name: Profile
    - icon: fontawesome/brands/github
      link: https://github.com/jatinarora30

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true, line_spans: __span, pygments_lang_class: true }
  - pymdownx.inlinehilite
  - pymdownx.magiclink       # bare URLs become clickable links
  - pymdownx.snippets
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
