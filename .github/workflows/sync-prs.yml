name: Sync PR statuses
on:
  schedule:
    - cron: "0 9 * * 1"     # every Monday 09:00 UTC
  workflow_dispatch:         # run it by hand from the Actions tab

permissions:
  contents: write            # commit status changes in prs.yml
  actions: write             # start the deploy workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Update status lines from GitHub
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          python3 scripts/sync_prs.py | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and redeploy if anything changed
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if git diff --quiet -- prs.yml; then echo "No status changes."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prs.yml
          git commit -m "Sync PR statuses from GitHub"
          git push
          # pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly
          gh workflow run deploy.yml --ref main
